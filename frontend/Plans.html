<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kế Hoạch Tập Luyện & Dinh Dưỡng - GymLife</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    body { background-color: #0d0d0d; color: white; font-family: 'Muli', sans-serif; }
    .plan-card {
      background: #1a1a1a; border-radius: 12px; padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      margin-bottom: 20px; transition: 0.3s;
    }
    .plan-card:hover { transform: translateY(-3px); }
    .btn-orange { background: #ff6600; color: #fff; border: none; }
    .btn-orange:hover { background: #ff8533; }
    .completed { text-decoration: line-through; color: #aaa; }
    .day-box {
      background: #141414; border-radius: 10px; padding: 15px;
      min-height: 180px; margin-bottom: 15px;
    }
    .day-title { color: #ff6600; font-weight: 700; margin-bottom: 10px; }
    .progress-bar { background-color: #ff6600; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="p-3 border-bottom border-secondary text-center">
    <h2 style="color:#ff6600;">📅 KẾ HOẠCH TẬP LUYỆN & DINH DƯỠNG</h2>
  </header>

  <div class="container py-4">
    <!-- Create Plan -->
    <div class="plan-card mb-4">
      <h4>Tạo kế hoạch mới</h4>
      <div class="row g-2">
        <div class="col-md-4"><input id="plan_name" class="form-control" placeholder="Tên kế hoạch (VD: Tăng cơ tuần 1)"></div>
        <div class="col-md-3">
          <select id="goal" class="form-select">
            <option value="tăng cơ">Tăng cơ</option>
            <option value="giảm cân">Giảm cân</option>
            <option value="duy trì">Duy trì</option>
          </select>
        </div>
        <div class="col-md-3">
          <select id="plan_type" class="form-select">
            <option value="weekly">Theo tuần</option>
            <option value="monthly">Theo tháng</option>
          </select>
        </div>
        <div class="col-md-2"><button id="createPlanBtn" class="btn btn-orange w-100">Tạo</button></div>
      </div>
    </div>

    <!-- Display User Plans -->
    <div id="userPlans"></div>

    <!-- Plan Details Section -->
    <div id="planDetails" style="display:none;">
      <h4 class="mt-4">Chi tiết kế hoạch: <span id="planTitle"></span></h4>
      <div class="progress my-3" style="height: 20px;">
        <div id="progressBar" class="progress-bar" style="width:0%">0%</div>
      </div>

      <div id="weekContainer" class="row"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_BASE = "http://localhost:5000/api";
    const token = localStorage.getItem("access_token");

    // ==========================================
    // 🟢 1. Tạo kế hoạch mới
    // ==========================================
    document.getElementById("createPlanBtn").addEventListener("click", async () => {
      const plan_name = document.getElementById("plan_name").value.trim();
      const goal = document.getElementById("goal").value;
      const plan_type = document.getElementById("plan_type").value;
      if (!plan_name) return alert("⚠️ Nhập tên kế hoạch!");

      const res = await fetch(`${API_BASE}/plans`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ plan_name, goal, plan_type })
      });
      const data = await res.json();
      if (res.ok) {
        alert("✅ Tạo kế hoạch thành công!");
        loadUserPlans();
      } else alert("❌ " + data.error);
    });

    // ==========================================
    // 🟡 2. Lấy danh sách kế hoạch của người dùng
    // ==========================================
    async function loadUserPlans() {
      const res = await fetch(`${API_BASE}/plans/user`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await res.json();
      const box = document.getElementById("userPlans");
      box.innerHTML = "";

      if (!data.length) {
        box.innerHTML = "<p class='text-center text-secondary'>Chưa có kế hoạch nào</p>";
        return;
      }

      data.forEach(p => {
        const percent = Math.round((p.completed_items / (p.total_items || 1)) * 100);
        const div = document.createElement("div");
        div.className = "plan-card";
        div.innerHTML = `
          <h5>${p.plan_name}</h5>
          <p>Mục tiêu: <b>${p.goal}</b></p>
          <div class="progress mb-2" style="height: 15px;">
            <div class="progress-bar" style="width:${percent}%">${percent}%</div>
          </div>
          <button class="btn btn-orange btn-sm" onclick="showPlanDetails(${p.plan_id}, '${p.plan_name}')">Xem chi tiết</button>
        `;
        box.appendChild(div);
      });
    }

    // ==========================================
    // 🔵 3. Hiển thị chi tiết kế hoạch theo ngày
    // ==========================================
    async function showPlanDetails(plan_id, plan_name) {
      document.getElementById("planDetails").style.display = "block";
      document.getElementById("planTitle").innerText = plan_name;

      const res = await fetch(`${API_BASE}/plans/${plan_id}/details`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await res.json();

      const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
      const container = document.getElementById("weekContainer");
      container.innerHTML = "";

      days.forEach(d => {
        const dayData = data.filter(item => item.day_of_week === d);
        const dayBox = document.createElement("div");
        dayBox.className = "col-md-3 day-box";
        dayBox.innerHTML = `<div class="day-title">${d}</div>`;

        if (!dayData.length) {
          dayBox.innerHTML += "<p class='text-secondary'>Chưa có nội dung</p>";
        } else {
          dayData.forEach(item => {
            dayBox.innerHTML += `
              <div>
                <span class="${item.is_completed ? 'completed' : ''}">
                  🏋️ ${item.workout_name || '---'} <br> 🍱 ${item.meal_name || '---'}
                </span><br>
                <button class="btn btn-sm btn-orange mt-1" onclick="markCompleted(${item.detail_id})">✔ Hoàn thành</button>
              </div>
              <hr style="border-color:#333;">
            `;
          });
        }
        container.appendChild(dayBox);
      });
    }

    // ==========================================
    // 🔴 4. Tick hoàn thành (update)
    // ==========================================
    async function markCompleted(id) {
      const res = await fetch(`${API_BASE}/plans/details/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ is_completed: true })
      });
      const data = await res.json();
      if (res.ok) {
        alert("✅ Cập nhật thành công!");
        loadUserPlans();
      } else alert("❌ " + data.error);
    }

    loadUserPlans();
  </script>
</body>
</html>
